global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "op-geth"
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["execution-client:6060"]

  - job_name: "op-node"
    static_configs:
      - targets: ["op-node:7300"]
